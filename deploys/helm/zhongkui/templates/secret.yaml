{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zhongkui.secretName" . }}
  labels:
    {{- include "zhongkui.labels" (dict "root" . "component" "secret") | nindent 4 }}
type: Opaque
stringData:
  core-dsn: {{ .Values.config.database.coreDSN | quote }}
  raw-dsn: {{ .Values.config.database.rawDSN | quote }}
  redis-cache-password: {{ .Values.config.redis.cachePassword | quote }}
  redis-pipeline-password: {{ .Values.config.redis.pipelinePassword | quote }}
  s3-access-key: {{ .Values.config.s3.accessKey | quote }}
  s3-secret-key: {{ .Values.config.s3.secretKey | quote }}
  smtp-password: {{ .Values.config.smtp.password | quote }}
  otel-headers: {{ .Values.otel.headers | quote }}
  grpc-access-key-id: {{ .Values.config.grpcClient.accessKeyID | quote }}
  grpc-access-key-secret: {{ .Values.config.grpcClient.accessKeySecret | quote }}
{{- end }}
