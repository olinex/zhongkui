apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "zhongkui.fullname" . }}-worker
  labels:
    {{- include "zhongkui.labels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "zhongkui.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zhongkui.selectorLabels" (dict "root" . "component" "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include "zhongkui.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "zhongkui.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: {{ include "zhongkui.coreImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run", "worker", "--config", "/etc/zhongkui/config.toml"]
          ports:
            - name: health
              containerPort: {{ .Values.config.health.port }}
              protocol: TCP
          env:
            {{- include "zhongkui.coreEnv" . | nindent 12 }}
            {{- include "zhongkui.otelEnv" (dict "root" . "service" "worker") | nindent 12 }}
          volumeMounts:
            {{- include "zhongkui.configVolumeMount" . | nindent 12 }}
            {{- include "zhongkui.cryptoVolumeMount" . | nindent 12 }}
          {{- include "zhongkui.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        {{- include "zhongkui.configVolume" . | nindent 8 }}
        {{- include "zhongkui.cryptoVolume" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
