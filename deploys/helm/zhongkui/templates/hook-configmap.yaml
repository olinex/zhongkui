# pre-install/pre-upgrade 迁移 Job 专用配置：资源创建前即可用，内容与主 ConfigMap 一致。
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zhongkui.fullname" . }}-config-hook
  labels:
    {{- include "zhongkui.labels" (dict "root" . "component" "config") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  config.toml: |
    {{- include "zhongkui.config" . | nindent 4 }}
