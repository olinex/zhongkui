{{- if .Values.otelCollector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "zhongkui.fullname" . }}-otel-collector
  labels:
    {{- include "zhongkui.labels" (dict "root" . "component" "otel-collector") | nindent 4 }}
data:
  config.yaml: |
    {{- if .Values.otelCollector.config }}
    {{- .Values.otelCollector.config | nindent 4 }}
    {{- else }}
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
    {{- end }}
{{- end }}
