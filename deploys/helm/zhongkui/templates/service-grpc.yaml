{{- if .Values.grpc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "zhongkui.fullname" . }}-grpc
  labels:
    {{- include "zhongkui.labels" (dict "root" . "component" "grpc") | nindent 4 }}
spec:
  type: {{ .Values.grpc.service.type }}
  ports:
    - name: grpc
      port: {{ .Values.grpc.service.port }}
      targetPort: grpc
      protocol: TCP
  selector:
    {{- include "zhongkui.selectorLabels" (dict "root" . "component" "grpc") | nindent 4 }}
{{- end }}
