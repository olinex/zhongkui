[cmd.create.testcase.short]
other = "Extract HTTP test cases from a pcap file"

[cmd.create.testcase.long]
other = "Use tshark to extract HTTP request/response data from a pcap file and generate JSON test case files for verifying TCP reassembly and HTTP protocol detection logic.\n\nEach HTTP transaction (request-response pair) generates one JSON file.\nSupports multiple transactions per TCP stream for HTTP/1.1 keep-alive connections."

[cmd.create.docs.short]
other = "Generate Diátaxis-classified documentation from code comments"

[cmd.create.docs.long]
other = "Scan the documentation registry, use gomarkdoc to export each package's comments as Markdown (tutorials/how-to/reference/explanation), and generate the project-root README.md (cover + table of contents) as the documentation entry point."

[cmd.create.default-config.short]
other = "Generate a default config.toml file"

[cmd.create.default-config.long]
other = "Create a config.toml template with common defaults at the specified path. Sensitive fields (passwords, secrets) are placeholders in <...> and must be replaced before starting the service."

[cmd.sync.short]
other = "Sync comment-generated docs and embedding vectors, and reconcile the embedding column dimension"

[cmd.sync.docs.short]
other = "Sync comment-generated documents into RAG"

[cmd.sync.docs.long]
other = "Extract source comments and generate narrative pages, then idempotently sync them into the builtin system namespace's RAG (format=generated) via a content-hash diff plan, visible to retrieval from every namespace. Additions/updates/deletions converge via the diff plan, unchanged content results in zero writes, the partition is read/written in isolation without touching manual documents, and nothing is written to disk."

[cmd.sync.apis.short]
other = "Sync native API knowledge into RAG"

[cmd.sync.apis.long]
other = "Assemble the native API catalog declared at view route registration (including purpose and request/response metadata), then idempotently sync it into the builtin system namespace's RAG (format=native_api) via a content-hash diff plan, visible to retrieval from every namespace. Additions/updates/deletions converge via the diff plan, unchanged content results in zero writes, the partition is read/written in isolation without touching narrative pages or manual documents, and nothing is written to disk."

[cmd.sync.schema.short]
other = "Sync database table knowledge into RAG"

[cmd.sync.schema.long]
other = "Parse model declarations and migrations to generate one knowledge document per migrated table (fields, nullability, indexes and foreign keys), then idempotently sync them into the builtin system namespace's RAG (format=schema) via a content-hash diff plan. Unchanged content results in zero writes, the partition is read/written in isolation without touching API, capability, narrative or manual documents, and nothing is written to disk."

[cmd.sync.capabilities.short]
other = "Sync platform capability knowledge into RAG"

[cmd.sync.capabilities.long]
other = "Generate one overall capability map plus one detail document per capability from the view-layer capability declarations, then idempotently sync them into the builtin system namespace's RAG (format=capability) via a content-hash diff plan. Unchanged content results in zero writes, the partition is read/written in isolation without touching API, table, narrative or manual documents, and nothing is written to disk."

[cmd.sync.embeddings.short]
other = "Recompute embedding vectors in a namespace with the current model"

[cmd.sync.embeddings.long]
other = "Recompute the embedding vectors in the target namespace with the current embedding model: knowledge documents are re-chunked and their chunk vectors rebuilt (knowledge_chunks), and long-term memories have their embedding column recomputed (agent_memories). Use this after switching the embedding model (dimension or semantic change) to align existing content with the current model; it does not modify document/memory bodies or full-text search columns, and does not touch other namespaces. For column-dimension changes, run sync embedding-dimensions first."

[cmd.sync.embedding-dimensions.short]
other = "Rebuild the embedding column and the HNSW index at the explicitly specified dimension"

[cmd.sync.embedding-dimensions.long]
other = "Rebuild the knowledge_chunks.embedding and agent_memories.embedding columns on the core database and their HNSW indexes at the target dimension explicitly specified by the operator: the target must be given through --dimensions and the embedding slot must be unbound before running it; the command drops the old index and all vectors, runs ALTER TYPE and rebuilds the HNSW index, and the knowledge base documents must be reindexed afterwards (run sync embeddings). It is the schema counterpart of sync embeddings and the two do not substitute for each other."

[cmd.force-reset-password.short]
other = "Force reset a user's password via the command line"

[cmd.s3.short]
other = "S3 object storage management"

[cmd.s3.long]
other = "S3 object storage management commands, including bucket lifecycle rule management"

[cmd.s3.lifecycle.short]
other = "Lifecycle rule management"

[cmd.s3.lifecycle.long]
other = "Inspect, apply and remove lifecycle rules of the default bucket; rules are executed by the S3 platform"

[cmd.s3.lifecycle.apply.short]
other = "Apply lifecycle rules"

[cmd.s3.lifecycle.apply.long]
other = "Collect lifecycle rules interactively and apply them to the default bucket as a whole (fully replacing the platform's existing rules).\n\nFlow: pick a target prefix from the built-in object path prefix enumeration, enter the expiration days, and optionally add more rules; preview and confirm before applying."

[cmd.s3.lifecycle.apply.example]
