# =============================================================================
# Tag rule Rego error/lint messages - Key layout: tagrule.*
# 标签规则 Rego 校验错误与字段 lint 告警文案，供接口层按请求语言翻译
# =============================================================================

[tagrule]
rego-invalid = "Rego rule violates the tag rule contract: it must be package zki with a tags rule"
lint-field-not-exist = "Field %s does not exist in the input document of this model, please check the spelling"
lint-field-hint = "Please choose a valid field from the input field panel or the completion list"

[tagrule.hint]
parse-unexpected = "Syntax error: unexpected token or keyword, please check the spelling and paired brackets/quotes"
parse-package = "Syntax error: invalid package declaration, expected: package zki"
parse-if = "Missing if keyword: rule body should be written as tags contains <value> if { ... }"
parse-contains = "Missing contains keyword: tag rules should be written as tags contains <value>"
parse-empty = "Empty module: please write at least one rule"
parse-illegal = "Syntax error: illegal expression, please check the code near this position"
parse-builtin-conflict = "A built-in function name cannot be used as a bare call: assign the result to a variable, e.g. x := sqlite.query(\"SELECT 1 AS x\", [])"
parse-fallback = "Rego syntax error: please check whether the code near this position is valid Rego"
compile-shadow = "Rule name conflict: a rule name cannot shadow other rules or keywords, please rename it"
compile-import-shadow = "Import conflict: the imported package name shadows another symbol, please adjust the import"
compile-var-shadow = "Variable name conflict: the variable name shadows a keyword or another binding, please rename it"
compile-fallback = "Rego compile error: rule definitions conflict or are invalid, please check rule names and assignment style"
type-undefined-function = "Type error: calling an undefined function, please check the function name spelling"
type-undefined-ref = "Type error: referencing a non-existent path, please check the field name spelling"
type-conflicting-rules = "Type error: conflicting definitions of the same rule (e.g. full assignment coexists with contains), please unify the style"
type-match-error = "Type error: operands on both sides of the expression do not match, please check the field types"
