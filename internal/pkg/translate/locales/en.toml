type-function = "Type error: incorrect function call (argument count or syntax), please check the call"
type-fallback = "Type error: operand types of the expression do not match, please check field types and function arguments"
unsafe-var = "Undefined variable: the expression references an unbound variable, please check the spelling or declare it with some"
recursion = "Recursion error: the rule references itself recursively, please check circular dependencies between rules"

