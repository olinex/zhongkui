[cmd.create.testcase.short]
other = "Extract HTTP test cases from a pcap file"

[cmd.create.testcase.long]
other = "Use tshark to extract HTTP request/response data from a pcap file and generate JSON test case files for verifying TCP reassembly and HTTP protocol detection logic.\n\nEach HTTP transaction (request-response pair) generates one JSON file.\nSupports multiple transactions per TCP stream for HTTP/1.1 keep-alive connections."

