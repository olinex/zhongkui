[tagengine.custom-functions.sqlite.query.description]
other = "Query a third-party datasource: run a SELECT statement against a datasource registered as an sqlite vtable and return an array of row objects.\nArguments: the first argument is the query statement (supporting ? placeholders), the second is the array of parameters bound in order.\nResult: each row is an object keyed by column name, accessed by index plus column name (e.g. rows[0].value); an empty array is returned when nothing matches and indexing it makes the rule body undefined, so guard with count(rows) > 0 first"

