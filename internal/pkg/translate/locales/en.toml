# =============================================================================
# AI capability disabled reasons (ai.disabled.*)
# The operator-facing copy explaining why the AI capability is unavailable: judged by the
# runtime snapshot of internal/ai and translated per request language by the view layer,
# returned with the status API and the slot-binding API.
# Keys and their data placeholders (uniformly written with the [[.X]] delimiter):
#   not-assembled  : the runtime has not completed its first assembly (no placeholder)
#   slot-unbound   : a required slot has no binding record ([[.Slot]])
#   model-disabled : the bound model is disabled ([[.Slot]] / [[.Model]])
#   kind-mismatch  : the bound model kind does not match the slot ([[.Slot]] / [[.Model]] / [[.Want]])
#   separator      : the joiner between multiple reasons
# =============================================================================

