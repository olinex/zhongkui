# =============================================================================
# CLI command descriptions & flag usages
# Key layout: cmd.<path>.short/long, flag.<path>.<name>, cli.<topic>
# Command tree fields store the i18n key itself; translate.T resolves them and
# returns the key when missing (zh-Hans.toml is the fallback locale).
# Set ZKI_LANG=en to enable English output.
# =============================================================================

[cmd.short]
other = "zhongkui root command"

[cmd.help.short]
other = "Show help for any command"

[cmd.help.long]
other = "Help shows help for any command in the application.\nType zhongkui help [command path] for full details."

[cmd.completion.short]
other = "Generate the autocompletion script for the specified shell"

[cmd.completion.long]
other = "Generate the zhongkui autocompletion script for the specified shell.\nSee each sub-command's help for usage details."

[cmd.completion.bash.short]
other = "Generate the autocompletion script for the bash shell"

[cmd.completion.bash.long]
other = "Generate the autocompletion script for the bash shell.\n\nThis script depends on the 'bash-completion' package.\nIf it is not installed already, you can install it via your OS's package manager.\n\nTo load completions in your current shell session:\n\n\tsource <(zhongkui completion bash)\n\nTo load completions for every new session, execute once:\n\n#### Linux:\n\n\tzhongkui completion bash > /etc/bash_completion.d/zhongkui\n\n#### macOS:\n\n\tzhongkui completion bash > $(brew --prefix)/etc/bash_completion.d/zhongkui\n\nYou will need to start a new shell for this setup to take effect."

[cmd.completion.zsh.short]
other = "Generate the autocompletion script for the zsh shell"

[cmd.completion.zsh.long]
other = "Generate the autocompletion script for the zsh shell.\n\nIf shell completion is not already enabled in your environment you will need to enable it. You can execute the following once:\n\n\techo \"autoload -U compinit; compinit\" >> ~/.zshrc\n\nTo load completions in your current shell session:\n\n\tsource <(zhongkui completion zsh)\n\nTo load completions for every new session, execute once:\n\n#### Linux:\n\n\tzhongkui completion zsh > \"${fpath[1]}/_zhongkui\"\n\n#### macOS:\n\n\tzhongkui completion zsh > $(brew --prefix)/share/zsh/site-functions/_zhongkui\n\nYou will need to start a new shell for this setup to take effect."

[cmd.completion.fish.short]
other = "Generate the autocompletion script for the fish shell"

[cmd.completion.fish.long]
other = "Generate the autocompletion script for the fish shell.\n\nTo load completions in your current shell session:\n\n\tzhongkui completion fish | source\n\nTo load completions for every new session, execute once:\n\n\tzhongkui completion fish > ~/.config/fish/completions/zhongkui.fish\n\nYou will need to start a new shell for this setup to take effect."

[cmd.completion.powershell.short]
other = "Generate the autocompletion script for PowerShell"

[cmd.completion.powershell.long]
other = "Generate the autocompletion script for PowerShell.\n\nTo load completions in your current shell session:\n\n\tzhongkui completion powershell | Out-String | Invoke-Expression\n\nTo load completions for every new session, add the output of the above command to your PowerShell profile."

