# =============================================================================
# Agent tunable parameter metadata (param.<Key>.label|comment)
# Keys map one-to-one onto the registry (Specs) of internal/ai and are globally unique,
# so each one is reused directly as part of its copy key: label is the display name and
# comment the description; the view layer translates them per request language and returns
# them with param/list. This file is the single source of that copy (the registry holds no
# duplicate): on a miss the label falls back to the short parameter name (the last key
# segment) and the comment to the key itself, with the key-completeness test in
# param_i18n_test.go as the backstop.
# =============================================================================

