<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重置密码</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="padding:32px;text-align:center;">
              <h2 style="margin:0 0 16px;color:#1f2328;font-size:22px;">重置您的账户密码</h2>
              <p style="margin:0 0 24px;color:#57606a;font-size:14px;line-height:1.7;">您好，{{.Username}}！我们收到了您的密码重置申请。请点击下方按钮设置新的登录密码，链接将在 <strong>{{.TokenTTL}}</strong> 内有效。</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center">
                    <a href="{{.ResetURL}}" style="display:inline-block;padding:12px 32px;background-color:#0969da;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;border-radius:6px;">重置密码</a>
                  </td>
                </tr>
              </table>
              <p style="margin:24px 0 0;color:#6e7781;font-size:13px;line-height:1.6;">如果按钮无法点击，请复制以下链接在浏览器中打开：<br><a href="{{.ResetURL}}" style="color:#0969da;word-break:break-all;">{{.ResetURL}}</a></p>
              <p style="margin:16px 0 0;color:#8b949e;font-size:12px;line-height:1.6;">如果这不是您本人的操作，请忽略本邮件，您的密码不会被更改。</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
