# =============================================================================
# Tag rule Rego error/lint messages - Key layout: tagrule.*
# 标签规则 Rego 校验错误与字段 lint 告警文案，供接口层按请求语言翻译
# =============================================================================

[tagrule]
rego-invalid = "规则源码不符合标签识别契约，应为 package zki 且包含 tags 规则"
lint-field-not-exist = "字段 %s 不存在于该模型的输入文档中，请检查拼写"
lint-field-hint = "请从输入字段面板或补全列表中选择合法字段"

[tagrule.hint]
parse-unexpected = "语法错误：出现意外的符号或关键字，请检查拼写与括号/引号是否成对"
parse-package = "语法错误：package 声明写法不正确，应为 package zki"
parse-if = "缺少 if 关键字：规则体写法应为 tags contains <值> if { ... }"
parse-contains = "缺少 contains 关键字：标签规则应使用 tags contains <值> 形式产出"
parse-empty = "模块为空：请至少编写一条规则"
parse-illegal = "语法错误：非法表达式，请检查该位置附近的写法"
parse-builtin-conflict = "内置函数名不能作为裸调用：请用变量接收返回值，例如 x := sqlite.query(\"SELECT 1 AS x\", [])"
parse-fallback = "Rego 语法错误：请检查该位置附近的书写是否符合 Rego 语法"
compile-shadow = "规则名冲突：规则名不能与其他规则或关键字重名，请换一个规则名"
compile-import-shadow = "import 冲突：导入的包名与其他符号重名，请调整导入"
compile-var-shadow = "变量名冲突：变量名不能与关键字或其他绑定重名，请换一个变量名"
compile-fallback = "Rego 编译错误：规则定义存在冲突或非法，请检查规则名与赋值方式"
type-undefined-function = "类型错误：调用了未定义的函数，请检查函数名拼写"
type-undefined-ref = "类型错误：引用了不存在的路径，请检查字段名拼写"
type-conflicting-rules = "类型错误：同名规则的定义方式相互冲突（如同时整体赋值与 contains），请统一写法"
type-match-error = "类型错误：表达式两侧类型不匹配，请检查字段类型"
type-function = "类型错误：函数调用方式不正确（参数个数或写法），请检查调用"
type-fallback = "类型错误：表达式操作数类型不匹配，请检查字段类型与函数参数"
unsafe-var = "未定义变量：表达式中引用了未绑定的变量，请检查变量名拼写或在 some 中声明"
recursion = "递归错误：规则定义存在递归引用，请检查规则间的循环依赖"

