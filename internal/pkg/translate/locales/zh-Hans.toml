[cmd.sync.docs.long]
other = "抽取源码注释并生成叙述页文档，按内容 hash 差异计划幂等同步到指定命名空间的 RAG（format=generated）；新增/更新/删除按差异收敛，内容未变则零写入，只读写该分区、不触碰人工文档，只入 RAG 不落盘。"

[cmd.sync.embeddings.short]
other = "以当前 embedding 模型重算命名空间下的向量表示"

[cmd.sync.embeddings.long]
other = "以当前 embedding 模型为准，重算指定命名空间下的向量表示：知识库文档重新切片并重建分块向量（knowledge_chunks），长期记忆重算 embedding 列（agent_memories）。用于更换 embedding 模型（维度或语义变化）后让既有内容与当前模型对齐；不改正文与全文检索列，不影响其它命名空间。列维度变更请先执行 sync embedding-dimensions。"

[cmd.sync.embedding-dimensions.short]
other = "按显式指定的维度重建 embedding 列与 HNSW 索引"

[cmd.sync.embedding-dimensions.long]
other = "按运维显式指定的目标维度重建 core 库的 knowledge_chunks.embedding 与 agent_memories.embedding 两列及其 HNSW 索引：须经 --dimensions 指定目标维度，执行前须先解绑 embedding 档位；命令会删除旧索引与全部向量、执行 ALTER TYPE、重建 HNSW 索引，完成后需重新索引知识库文档（执行 sync embeddings）。它与 sync embeddings 是同一命令组内的并列两条：本命令只改 schema（列维度），sync embeddings 只改内容（重嵌入向量），二者互不替代。"

