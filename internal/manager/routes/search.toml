# 原始流量审计 - IPv4 TCP 包
# 过滤字段：timestamp / created_at / namespace 必填（required = true；双时间范围命中分区键与 ORDER BY 首键，
# namespace 由前端全局命名空间提供）；可选字段仅精确匹配（eq），配合 bloom_filter 跳过索引在十亿级数据上按数据块剪枝。
[Ipv4TcpListGet]
[[Ipv4TcpListGet.orderByFields]]
fieldName = "timestamp"
column = "timestamp"

[[Ipv4TcpListGet.filterByFields]]
fieldName = "timestampFrom"
fieldType = "time.Time"
column = "timestamp"
binding = "required"
required = true
actions = ["gte"]

[[Ipv4TcpListGet.filterByFields]]
fieldName = "timestampTo"
fieldType = "time.Time"
column = "timestamp"
binding = "required"
required = true
actions = ["lte"]

[[Ipv4TcpListGet.filterByFields]]
fieldName = "createdAtFrom"
fieldType = "time.Time"
column = "created_at"
binding = "required"
required = true
actions = ["gte"]

[[Ipv4TcpListGet.filterByFields]]
fieldName = "createdAtTo"
fieldType = "time.Time"
column = "created_at"
binding = "required"
required = true
actions = ["lte"]

[[Ipv4TcpListGet.filterByFields]]
fieldName = "namespace"
fieldType = "string"
column = "namespace"
binding = "required"
required = true
actions = ["eq"]

[[Ipv4TcpListGet.filterByFields]]
fieldName = "sessionId"
fieldType = "serializer.HexUUID"
column = "session_id"
binding = ""
actions = ["eq", "neq"]

[[Ipv4TcpListGet.filterByFields]]
fieldName = "tcpStreamId"
fieldType = "string"
column = "tcp_stream_id"
binding = ""
actions = ["eq"]

[[Ipv4TcpListGet.filterByFields]]
fieldName = "ipv4Src"
fieldType = "serializer.IPv4Addr"
column = "ipv4_src"
binding = ""
actions = ["eq", "neq"]
# IPv4 原生列：以文本传值（127.0.0.1），ClickHouse 字符串隐式比较
textValue = true

[[Ipv4TcpListGet.filterByFields]]
fieldName = "ipv4Dst"
fieldType = "serializer.IPv4Addr"
column = "ipv4_dst"
binding = ""
actions = ["eq", "neq"]
textValue = true

[[Ipv4TcpListGet.filterByFields]]
fieldName = "srcPort"
fieldType = "uint16"
column = "tcp_src_port"
binding = ""
actions = ["eq", "neq", "lt", "lte", "gt", "gte"]

[[Ipv4TcpListGet.filterByFields]]
fieldName = "dstPort"
fieldType = "uint16"
column = "tcp_dst_port"
binding = ""
actions = ["eq", "neq", "lt", "lte", "gt", "gte"]

