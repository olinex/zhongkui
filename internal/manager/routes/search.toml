# 原始流量审计 - IPv4 TCP 包
# 过滤字段：timestamp / created_at 两个时间范围必填（required = true，命中 ORDER BY 首键，防全表扫描）；
# namespace 精确过滤；session_id 按 UUID 精确过滤；tcp_stream_id 流标识过滤。
[Ipv4TcpListGet]
[[Ipv4TcpListGet.orderByFields]]
fieldName = "timestamp"
column = "timestamp"

[[Ipv4TcpListGet.filterByFields]]
fieldName = "timestampFrom"
fieldType = "time.Time"
column = "timestamp"
binding = "required"
required = true
actions = ["gte"]

[[Ipv4TcpListGet.filterByFields]]
fieldName = "timestampTo"
fieldType = "time.Time"
column = "timestamp"
binding = "required"
required = true
actions = ["lte"]

[[Ipv4TcpListGet.filterByFields]]
fieldName = "createdAtFrom"
fieldType = "time.Time"
column = "created_at"
binding = "required"
required = true
actions = ["gte"]

[[Ipv4TcpListGet.filterByFields]]
fieldName = "createdAtTo"
fieldType = "time.Time"
column = "created_at"
binding = "required"
required = true
actions = ["lte"]

[[Ipv4TcpListGet.filterByFields]]
fieldName = "namespace"
fieldType = "string"
column = "namespace"
binding = ""
actions = ["eq"]

[[Ipv4TcpListGet.filterByFields]]
fieldName = "sessionId"
fieldType = "serializer.HexUUID"
column = "session_id"
binding = ""
actions = ["eq", "neq"]

[[Ipv4TcpListGet.filterByFields]]
fieldName = "tcpStreamId"
fieldType = "string"
column = "tcp_stream_id"
binding = ""
actions = ["eq"]

