# 内置默认通知模板注册表（事件模板规格）。
# 具体有哪些事件由代码实现决定（见 core.EventTypeXxx / notify.TemplateXxx 常量）；
# 新增事件时在此登记一条 [[event]] 条目。
#
# event/template/channels/languages 为事件元信息；title/content 按语言键（如 zh-Hans、en）
# 提供各语言下的标题/正文 Go text/template 模板（正文可含 {{range}} 多行结构）。
# 该文件经 //go:embed 内嵌，由 template.go 在初始化时解析为 EventTemplateSpec 并校验模板语法。
#
# Built-in default notification template registry (event template specs).
# The concrete events are decided by the code (see core.EventTypeXxx / notify.TemplateXxx);
# register a [[event]] entry here when a new event is added.
#
# event/template/channels/languages are event metadata; title/content provide the per-language
# (e.g. zh-Hans, en) Go text/template title and content templates (content may use {{range}}
# multi-line constructs). This file is embedded via //go:embed and parsed into EventTemplateSpec
# by template.go at init, with template syntax validated there.

[[event]]
event = "tag_event_record"
template = "tag_event.alert"
channels = ["*"]
languages = ["zh-Hans", "en"]

[event.title]
"zh-Hans" = "标签事件告警: {{.RuleName}}"
"en" = "Tag Event Alert: {{.RuleName}}"

[event.content]
"zh-Hans" = """命名空间: {{.Namespace}}
事件规则: {{.RuleName}}
检测时间: {{.DetectedAt}}
{{range .Hits}}- 条件 {{.ConditionName}}: {{.Dimension}}/{{.Item}} = {{.Count}} (阈值 {{.Threshold}})
{{end}}"""
"en" = """Namespace: {{.Namespace}}
Event rule: {{.RuleName}}
Detected at: {{.DetectedAt}}
{{range .Hits}}- Condition {{.ConditionName}}: {{.Dimension}}/{{.Item}} = {{.Count}} (threshold {{.Threshold}})
{{end}}"""