# huginn_ffi：Huginn Net 被动指纹识别库的 C ABI 封装 crate
# 产物：libhuginn_ffi.dylib（cdylib）与 libhuginn_ffi.a（staticlib），供 Go 侧通过 cgo 链接
[package]
name = "huginn_ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "huginn_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
huginn-net-tcp.workspace = true
huginn-net-http.workspace = true
huginn-net-db.workspace = true
pnet.workspace = true
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
