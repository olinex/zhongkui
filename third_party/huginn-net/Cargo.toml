# workspace 根：Huginn Net 被动指纹识别库的 Rust → C FFI 工程
# 本目录与 Go 代码完全隔离，不 import 任何 Go 代码（遵循 golang-standards/project-layout 的 third_party/ 约定）
[workspace]
resolver = "2"
members = ["ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/biandratti/huginn-net"
rust-version = "1.85"

# workspace 级依赖统一版本，供各成员 crate 通过 `xxx.workspace = true` 引用
[workspace.dependencies]
huginn-net-tcp = { version = "2.0.0", features = ["full", "json"] }
huginn-net-http = { version = "2.0.0", features = ["full", "json"] }
huginn-net-db = { version = "2.0.0", features = ["full"] }
pnet = "0.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
