        ipv4FragOffset: 分片偏移
        ipv4Ttl: 生存时间
        ipv4IpProtocol: 上层协议
        ipv4Checksum: 头部校验和
        ipv4Src: 源 IP
        ipv4Dst: 目的 IP
        ipv4Options: IP 选项
        ipv4Padding: 填充字节
        ipv6Version: IP 版本
        ipv6TrafficClass: 流量类别
        ipv6FlowLabel: 流标签
        ipv6Length: 载荷长度
        ipv6NextHeader: 下一头部
        ipv6HopLimit: 跳数限制
        ipv6Src: 源 IP
        ipv6Dst: 目的 IP
        ipv6HopByHop: 逐跳选项
        ipv6LastHeader: 最后头部
        srcPort: 源端口
        dstPort: 目的端口
        seq: 序列号
        ack: 确认号
        dataOffset: 头部长度
        bitFin: 结束标志
        bitSyn: 同步标志
        bitRst: 重置标志
        bitPsh: 推送标志
        bitAck: 确认标志
        bitUrg: 紧急标志
        bitEce: ECE 标志
        bitCwr: CWR 标志
        bitNs: NS 标志
        window: 窗口大小
        checksum: 校验和
        urgent: 紧急指针
        options: TCP 选项
        length: 数据长度
      desc:
        ethDstMac: 目的 MAC 地址，标识数据帧的目标网卡
        ethSrcMac: 源 MAC 地址，标识数据帧的发送网卡
        ethType: 以太网类型，标识上层协议（如 IPv4、IPv6、ARP）
        ethLength: 以太网帧的长度（字节）
        ipv4Version: IP 协议版本，IPv4 固定为 4
        ipv4Ihl: IPv4 头部长度（单位：4 字节）
        ipv4Tos: 服务类型，用于 QoS 优先级控制
        ipv4Length: IP 数据报总长度（头部 + 数据，字节）
        ipv4Id: 标识符，用于分片重组
        ipv4Flags: 分片标志位：DF（不分片）、MF（更多分片）
        ipv4FragOffset: 分片偏移（单位：8 字节）
        ipv4Ttl: 生存时间，每经过一跳减 1，为 0 时丢弃
        ipv4IpProtocol: 上层协议类型（如 TCP=6、UDP=17、ICMP=1）
        ipv4Checksum: 头部校验和，用于差错检测
        ipv4Src: 源 IP 地址，数据包的发送方
        ipv4Dst: 目的 IP 地址，数据包的接收方
        ipv4Options: IP 选项（可选，通常为空）
        ipv4Padding: 填充字节，保证头部长度对齐
        ipv6Version: IP 协议版本，IPv6 固定为 6
        ipv6TrafficClass: 流量类别，用于 QoS 区分
        ipv6FlowLabel: 流标签，标识同一条数据流
        ipv6Length: 有效载荷长度（不含 IPv6 头部，字节）
        ipv6NextHeader: 下一头部类型（扩展头或传输层协议）
        ipv6HopLimit: 跳数限制，等价于 IPv4 的 TTL
        ipv6Src: 源 IPv6 地址，数据包的发送方
        ipv6Dst: 目的 IPv6 地址，数据包的接收方
        ipv6HopByHop: 逐跳选项扩展头，由沿途每个路由器处理
        ipv6LastHeader: 最后一个头部类型（通常是 TCP/UDP）
        srcPort: 源端口号，标识发送数据的应用
        dstPort: 目的端口号，标识接收数据的应用
        seq: TCP 序列号，标识字节流中第一个字节的位置
        ack: TCP 确认号，期望接收的下一个字节序号
        dataOffset: TCP 头部长度（单位：4 字节）
        bitFin: FIN 标志：发送方数据已发送完毕
        bitSyn: SYN 标志：用于建立连接时同步序列号
        bitRst: RST 标志：异常中断连接
        bitPsh: PSH 标志：接收方应立即交付数据
        bitAck: ACK 标志：确认号有效
        bitUrg: URG 标志：紧急指针有效
        bitEce: ECE 标志：显式拥塞通知回显
        bitCwr: CWR 标志：拥塞窗口已减小
        bitNs: NS 标志：随机序列号保护（Nonce Sum）
        window: 接收窗口大小，用于流量控制
        checksum: 校验和，用于差错检测
        urgent: 紧急指针，配合 URG 标志使用
        options: TCP 选项列表（MSS、窗口缩放、时间戳等）
        length: UDP 数据报总长度（头部 + 数据，字节）
      value:
        yes: 是
        no: 否
        none: 无
      flag:
        evil: 保留位
        df: 不分片（DF）
        mf: 更多分片（MF）
