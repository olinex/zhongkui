    # 协议头部可读化：逐字段名/值/说明（header.field.<key> 与 header.desc.<key> 的 key 与 JSON 字段名一致）
    header:
      title: 协议头部详情
      rawJson: 查看原始 JSON
      loopbackNote: 本机回环（Loopback）流量，无真实链路层信息
      col:
        field: 字段
        value: 值
        desc: 说明
      field:
        ethDstMac: 目的 MAC
        ethSrcMac: 源 MAC
        ethType: 以太网类型
        ethLength: 帧长度
        ipv4Version: IP 版本
        ipv4Ihl: 头部长度
        ipv4Tos: 服务类型
        ipv4Length: 总长度
        ipv4Id: 标识符
