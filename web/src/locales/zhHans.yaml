    positive: "{path}必须为正数"
    negative: "{path}必须为负数"
    integer: "{path}必须为整数"
  date:
    min: "{path}必须晚于{min}"
    max: "{path}必须早于{max}"
  boolean:
    isValue: "{path}必须为{value}"
  object:
    noUnknown: "{path}字段包含未指定的键：{unknown}"
