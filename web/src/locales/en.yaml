  # Traffic audit consists of three independent data types, each with its own complete field set
  ipv4Tcp:
    name: IPv4 TCP
    field:
      # Base audit columns
      namespace: Namespace
      timestamp: Capture Time
      createdAt: Ingestion Time
      sessionId: Session ID
      tcpStreamId: TCP Stream ID
      capture: Capturer
      version: Version
      traceId: Trace ID
      # IPv4 address & ports
      ipv4Src: IPv4 Source Address
      ipv4Dst: IPv4 Destination Address
      srcPort: Source Port
      dstPort: Destination Port
      # TCP audit columns
      seq: Sequence Number
      ack: Acknowledgment Number
      bitFin: FIN Flag
      bitSyn: SYN Flag
      bitRst: RST Flag
      bitPsh: PSH Flag
      bitAck: ACK Flag
      bitUrg: URG Flag
      window: Window Size
      ipv4Ttl: IPv4 TTL
      ipv4IpProtocol: IPv4 Protocol
      ipv4Length: IPv4 Length
      # TCP passive fingerprint (p0f style)
      fpOs: OS Fingerprint
      fpSig: TCP Fingerprint Signature
      fpMtu: MTU
      # ---- Full field set for column settings (hidden by default) ----
      # Capture & link layer
      truncated: Truncated
      captureLength: Capture Length
      layerStack: Protocol Stack
      payload: Payload
      ethDstMac: Destination MAC
      ethSrcMac: Source MAC
      ethType: Ethernet Type
      ethLength: Ethernet Length
      # IPv4
      ipv4Version: IPv4 Version
      ipv4Ihl: IPv4 Header Length
      ipv4Tos: Type of Service
      ipv4Id: Fragment ID
      ipv4Flags: Fragment Flags
      ipv4FragOffset: Fragment Offset
      ipv4Checksum: Header Checksum
      ipv4Options: IPv4 Options
      ipv4Padding: IPv4 Padding
      # TCP
      dataOffset: Data Offset
      bitEce: ECE Flag
      bitCwr: CWR Flag
      bitNs: NS Flag
      checksum: Checksum
      urgent: Urgent Pointer
      options: TCP Options
      fpOsQuality: OS Fingerprint Confidence
