      desc:
        ethDstMac: Destination MAC address of the data frame
        ethSrcMac: Source MAC address of the data frame
        ethType: Ethernet type identifying the upper-layer protocol (IPv4, IPv6, ARP, etc.)
        ethLength: Ethernet frame length in bytes
        ipv4Version: IP protocol version, always 4 for IPv4
        ipv4Ihl: IPv4 header length in 32-bit words
        ipv4Tos: Type of service for QoS prioritization
        ipv4Length: Total IP datagram length (header + data) in bytes
        ipv4Id: Identification used for fragment reassembly
        ipv4Flags: "Fragment flags: DF (don't fragment), MF (more fragments)"
        ipv4FragOffset: Fragment offset in 8-byte units
        ipv4Ttl: Time to live, decremented by one per hop; packet is dropped at 0
        ipv4IpProtocol: Upper-layer protocol number (TCP=6, UDP=17, ICMP=1, etc.)
        ipv4Checksum: Header checksum for error detection
        ipv4Src: Source IP address of the packet
        ipv4Dst: Destination IP address of the packet
        ipv4Options: IP options (rarely used, usually empty)
        ipv4Padding: Padding bytes to align the header length
        ipv6Version: IP protocol version, always 6 for IPv6
        ipv6TrafficClass: Traffic class for QoS differentiation
        ipv6FlowLabel: Flow label identifying packets of the same flow
        ipv6Length: Payload length excluding the IPv6 header, in bytes
        ipv6NextHeader: Next header type (extension header or transport protocol)
        ipv6HopLimit: Hop limit, equivalent to IPv4 TTL
        ipv6Src: Source IPv6 address of the packet
        ipv6Dst: Destination IPv6 address of the packet
        ipv6HopByHop: Hop-by-hop options extension header, processed by every router
        ipv6LastHeader: Last header type (usually TCP/UDP)
        srcPort: Source port identifying the sending application
        dstPort: Destination port identifying the receiving application
        seq: TCP sequence number of the first byte in the stream
        ack: TCP acknowledgment number of the next expected byte
        dataOffset: TCP header length in 32-bit words
        bitFin: "FIN flag: sender has finished sending data"
        bitSyn: "SYN flag: synchronizes sequence numbers to establish a connection"
        bitRst: "RST flag: abnormally resets the connection"
        bitPsh: "PSH flag: receiver should deliver data immediately"
        bitAck: "ACK flag: the acknowledgment number is valid"
        bitUrg: "URG flag: the urgent pointer is valid"
        bitEce: "ECE flag: explicit congestion notification echo"
        bitCwr: "CWR flag: congestion window reduced"
        bitNs: "NS flag: nonce sum protection for random sequence numbers"
        window: Receive window size for flow control
        checksum: Checksum for error detection
        urgent: Urgent pointer offset, used with the URG flag
        options: TCP option list (MSS, window scale, timestamps, etc.)
        length: Total UDP datagram length (header + data) in bytes
      value:
        yes: "Yes"
        no: "No"
        none: none
      flag:
        evil: Reserved
        df: Don't Fragment (DF)
        mf: More Fragments (MF)
