name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # CI 必须强制检查 Web 生产依赖的许可证
      LICENSE_CHECK_REQUIRE_WEB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      # 采集侧使用 cgo 链接 libpcap，构建前安装系统依赖
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      # 发布前复用统一 CI 入口，避免与 ci.yml 出现两套检查逻辑
      - run: make ci
      - name: 构建 release 二进制
        run: make build-release VERSION="${GITHUB_REF_NAME}"
      - name: 打包并生成校验和
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="zki_${version}_linux_amd64.tar.gz"
          mkdir -p dist
          cp bin/zki LICENSE NOTICE THIRD_PARTY_LICENSES.md dist/
          tar -C dist -czf "${archive}" zki LICENSE NOTICE THIRD_PARTY_LICENSES.md
          sha256sum "${archive}" > "${archive}.sha256"
      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            zki_*.tar.gz zki_*.tar.gz.sha256 \
            --title "zhongkui ${GITHUB_REF_NAME}" \
            --generate-notes
