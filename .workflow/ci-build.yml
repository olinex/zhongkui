version: "1.0"
name: 构建、上传、发布
displayName: 构建发布
stages:
- name: 预处理
  displayName: 预处理
  strategy: fast
  trigger: auto
  steps:
  - step: out-param@tools
    name: 39db0d5e-3026-44df-8783-f9d2f3681ab1
    displayName: SemVer Part 参数产出
    params:
      SEMVER_MAJOR: "$(echo ${GITEE_BRANCH} | sed -E 's/^v([0-9]+)\\..*/\\1/')"
      SEMVER_MINOR: "$(echo ${GITEE_BRANCH} | sed -E 's/^v[0-9]+\\.([0-9]+)\\..*/\\\
        1/')"
      SEMVER_PATCH: "$(echo ${GITEE_BRANCH} | sed -E 's/^v[0-9]+\\.[0-9]+\\.([0-9]+).*/\\\
        1/')"
      SEMVER_PRERELEASE: "$(echo ${GITEE_BRANCH} | sed -E 's/^v[0-9]+\\.[0-9]+\\.[0-9]+-(alpha|beta|rc)\\\
        .([1-9][0-9]*)$/\\2/; t; s/.*/0/')"
    strategy:
      retry: "0"
  - step: out-param@tools
    name: d9fc2f24-db48-4c11-8b67-7c3d90c82167
    displayName: SemVer Release 参数产出
    params:
      SEMVER_RELEASE: "${SEMVER_MAJOR}.${SEMVER_MINOR}.${SEMVER_PATCH}.${SEMVER_PRERELEASE}"
    strategy:
      retry: "0"
    dependsOn: 39db0d5e-3026-44df-8783-f9d2f3681ab1
- name: 构建镜像
  displayName: 构建镜像
  strategy: naturally
  trigger: auto
  steps:
  - step: image-build-plus@buildkitd
    name: da30ea79-8f23-4a8e-a7ea-ed1958400a52
    displayName: normal arm64 core 镜像构建
    dockerCerts:
    - uuid: ecd6bdc0-bca1-013f-becb-4e858993359a
    tag: "${TARGET_REGISTRY_MIRROR}/zhongkui/zhongkui-core:${GITEE_BRANCH}-arm64"
    dockerfile: ./Dockerfile
    context: ""
    artifacts: []
    isCache: false
    processorType:
    - arm64
    parameter:
      GOLANG_IMAGE: "${REGISTRY_MIRROR}/library/golang:1.27.3-bookworm"
      RUNTIME_IMAGE: "${REGISTRY_MIRROR}/library/debian:bookworm-slim"
      APT_MIRROR: "${APT_MIRROR}"
      GOPROXY: "${GOPROXY}"
      VERSION: "${GITEE_BRANCH}"
      COMMIT: "${GITEE_SHORT_COMMIT}"
      BUILDER: "${GITEE_PIPELINE_TRIGGER_USER}@${GITEE_PIPELINE_NAME}:${GITEE_PIPELINE_BUILD_NUMBER}"
      IMAGE_VARIANT: normal
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
  - step: image-build-plus@buildkitd
    name: ecd9f8e2-e7ba-4ae3-96c9-852a58e50ebb
    displayName: normal amd64 core 镜像构建
    dockerCerts:
    - uuid: ecd6bdc0-bca1-013f-becb-4e858993359a
    tag: "${TARGET_REGISTRY_MIRROR}/zhongkui/zhongkui-core:${GITEE_BRANCH}-amd64"
    dockerfile: ./Dockerfile
    context: ""
    artifacts: []
    isCache: false
    processorType:
    - amd64
    parameter:
      GOLANG_IMAGE: "${REGISTRY_MIRROR}/library/golang:1.27.3-bookworm"
      RUNTIME_IMAGE: "${REGISTRY_MIRROR}/library/debian:bookworm-slim"
      APT_MIRROR: "${APT_MIRROR}"
      GOPROXY: "${GOPROXY}"
      VERSION: "${GITEE_BRANCH}"
      COMMIT: "${GITEE_SHORT_COMMIT}"
      BUILDER: "${GITEE_PIPELINE_TRIGGER_USER}@${GITEE_PIPELINE_NAME}:${GITEE_PIPELINE_BUILD_NUMBER}"
      IMAGE_VARIANT: normal
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
  - step: image-build-plus@buildkitd
    name: 6acefe26-d61b-417b-aef7-09cea931f155
    displayName: slim arm64 core 镜像构建
    dockerCerts:
    - uuid: ecd6bdc0-bca1-013f-becb-4e858993359a
    tag: "${TARGET_REGISTRY_MIRROR}/zhongkui/zhongkui-core:${GITEE_BRANCH}-arm64-slim"
    dockerfile: ./Dockerfile
    context: ""
    artifacts: []
    isCache: false
    processorType:
    - arm64
    parameter:
      GOLANG_IMAGE: "${REGISTRY_MIRROR}/library/golang:1.27.3-bookworm"
      RUNTIME_IMAGE: "${REGISTRY_MIRROR}/library/debian:bookworm-slim"
      APT_MIRROR: "${APT_MIRROR}"
      GOPROXY: "${GOPROXY}"
      VERSION: "${GITEE_BRANCH}"
      COMMIT: "${GITEE_SHORT_COMMIT}"
      BUILDER: "${GITEE_PIPELINE_TRIGGER_USER}@${GITEE_PIPELINE_NAME}:${GITEE_PIPELINE_BUILD_NUMBER}"
      IMAGE_VARIANT: slim
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
  - step: image-build-plus@buildkitd
    name: fa79664f-7a6a-481e-b55b-600a75f6604b
    displayName: slim amd64 core 镜像构建
    dockerCerts:
    - uuid: ecd6bdc0-bca1-013f-becb-4e858993359a
    tag: "${TARGET_REGISTRY_MIRROR}/zhongkui/zhongkui-core:${GITEE_BRANCH}-amd64-slim"
    dockerfile: ./Dockerfile
    context: ""
    artifacts: []
    isCache: false
    processorType:
    - amd64
    parameter:
      GOLANG_IMAGE: "${REGISTRY_MIRROR}/library/golang:1.27.3-bookworm"
      RUNTIME_IMAGE: "${REGISTRY_MIRROR}/library/debian:bookworm-slim"
      APT_MIRROR: "${APT_MIRROR}"
      GOPROXY: "${GOPROXY}"
      VERSION: "${GITEE_BRANCH}"
      COMMIT: "${GITEE_SHORT_COMMIT}"
      BUILDER: "${GITEE_PIPELINE_TRIGGER_USER}@${GITEE_PIPELINE_NAME}:${GITEE_PIPELINE_BUILD_NUMBER}"
      IMAGE_VARIANT: slim
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
  - step: image-build-plus@buildkitd
    name: 44667782-dd61-475d-ad34-23ba3ea3daea
    displayName: normal arm64 web 镜像构建
    dockerCerts:
    - uuid: ecd6bdc0-bca1-013f-becb-4e858993359a
    tag: "${TARGET_REGISTRY_MIRROR}/zhongkui/zhongkui-web:${GITEE_BRANCH}-arm64"
    dockerfile: ./web/Dockerfile
    context: ""
    artifacts: []
    isCache: false
    processorType:
    - arm64
    parameter:
      NODE_IMAGE: "${REGISTRY_MIRROR}/library/node:22-bookworm-slim"
      NGINX_IMAGE: "${REGISTRY_MIRROR}/library/nginx:1.27-alpine"
      VITE_DOCS_URL: /docs/
      DOCS_BASE: /docs/
      DOCS_CONSOLE_URL: /console
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
  - step: image-build-plus@buildkitd
    name: b5586f09-be48-46e7-88f9-05c08c23a566
    displayName: normal amd64 web 镜像构建
    dockerCerts:
    - uuid: ecd6bdc0-bca1-013f-becb-4e858993359a
    tag: "${TARGET_REGISTRY_MIRROR}/zhongkui/zhongkui-web:${GITEE_BRANCH}-amd64"
    dockerfile: ./web/Dockerfile
    context: ""
    artifacts: []
    isCache: false
    processorType:
    - amd64
    parameter:
      NODE_IMAGE: "${REGISTRY_MIRROR}/library/node:22-bookworm-slim"
      NGINX_IMAGE: "${REGISTRY_MIRROR}/library/nginx:1.27-alpine"
      VITE_DOCS_URL: /docs/
      DOCS_BASE: /docs/
      DOCS_CONSOLE_URL: /console
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 合并镜像
  displayName: 合并镜像
  strategy: naturally
  trigger: auto
  steps:
  - step: manifest-merge@crane
    name: 81eff12b-a585-4ed8-9945-32362a2199da
    displayName: slim core 镜像 Manifest 合并
    dockerCerts:
    - uuid: ecd6bdc0-bca1-013f-becb-4e858993359a
    targetImageName: "${TARGET_REGISTRY_MIRROR}/zhongkui/zhongkui-core:${GITEE_BRANCH}-slim"
    sourceImageAmd: "${TARGET_REGISTRY_MIRROR}/zhongkui/zhongkui-core:${GITEE_BRANCH}-amd64-slim"
    sourceImageArm: "${TARGET_REGISTRY_MIRROR}/zhongkui/zhongkui-core:${GITEE_BRANCH}-arm64-slim"
    strategy:
      retry: "0"
      resource:
        cpu: "1"
        memory: "2"
  - step: manifest-merge@crane
    name: 4bc1af80-4db6-4565-8410-9c9edef62451
    displayName: normal core 镜像 Manifest 合并
    dockerCerts:
    - uuid: ecd6bdc0-bca1-013f-becb-4e858993359a
    targetImageName: "${TARGET_REGISTRY_MIRROR}/zhongkui/zhongkui-core:${GITEE_BRANCH}"
    sourceImageAmd: "${TARGET_REGISTRY_MIRROR}/zhongkui/zhongkui-core:${GITEE_BRANCH}-amd64"
    sourceImageArm: "${TARGET_REGISTRY_MIRROR}/zhongkui/zhongkui-core:${GITEE_BRANCH}-arm64"
    strategy:
      retry: "0"
      resource:
        cpu: "1"
        memory: "2"
  - step: manifest-merge@crane
    name: d0d41543-3c31-4ec6-bcb0-1b7638a3d649
    displayName: web 镜像 Manifest 合并
    dockerCerts:
    - uuid: ecd6bdc0-bca1-013f-becb-4e858993359a
    targetImageName: "${TARGET_REGISTRY_MIRROR}/zhongkui/zhongkui-web:${GITEE_BRANCH}"
    sourceImageAmd: "${TARGET_REGISTRY_MIRROR}/zhongkui/zhongkui-web:${GITEE_BRANCH}-amd64"
    sourceImageArm: "${TARGET_REGISTRY_MIRROR}/zhongkui/zhongkui-web:${GITEE_BRANCH}-arm64"
    strategy:
      retry: "0"
      resource:
        cpu: "1"
        memory: "2"
- name: 提取制品
  displayName: 提取制品
  strategy: fast
  trigger: auto
  steps:
  - step: execute@docker
    name: cbaa695f-0392-4093-ac5d-9e85d79a322b
    displayName: core arm64 binary 提取
    certificate: ecd6bdc0-bca1-013f-becb-4e858993359a
    image: "${TARGET_REGISTRY_MIRROR}/zhongkui/zhongkui-core:${GITEE_BRANCH}-arm64"
    command:
    - "# 提取 zki（容器内以 app 用户执行，/tmp 1777 可写）"
    - ls -lha $(which zki)
    - cp $(which zki) /tmp/zki
    artifacts:
    - name: zki_core_arm64
      path:
      - /tmp/zki
      type: .tar.gz
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
  - step: execute@docker
    name: d2bb545d-f481-40d6-842e-678d64e3e60c
    displayName: core amd64 binary 提取
    certificate: ecd6bdc0-bca1-013f-becb-4e858993359a
    image: "${TARGET_REGISTRY_MIRROR}/zhongkui/zhongkui-core:${GITEE_BRANCH}-amd64"
    command:
    - "# 提取 zki（容器内以 app 用户执行，/tmp 1777 可写）"
    - ls -lha $(which zki)
    - cp $(which zki) /tmp/zki
    artifacts:
    - name: zki_core_amd64
      path:
      - /tmp/zki
      type: .tar.gz
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 上传制品
  displayName: 上传制品
  strategy: fast
  trigger: auto
  steps:
  - step: publish@general_artifacts
    name: 431290a8-79e0-483d-a6cc-7da0258d98eb
    displayName: core arm64 binary 上传
    dependArtifact: zki_core_arm64
    artifactName: zki_core_arm64.tar.gz
    strategy:
      retry: "0"
  - step: publish@general_artifacts
    name: ae7548d0-ba82-4cb7-8663-f33ffce50716
    displayName: core amd64 binary 上传
    dependArtifact: zki_core_amd64
    artifactName: zki_core_amd64.tar.gz
    strategy:
      retry: "0"
- name: 正式发布
  displayName: 正式发布
  strategy: fast
  trigger: auto
  steps:
  - step: publish@release_artifacts
    name: 574cba1d-3f03-4ef8-8647-c644819efb25
    displayName: core arm64 发布
    dependArtifact: zki_core_arm64.tar.gz
    version: "${SEMVER_RELEASE}"
    autoIncrement: false
    strategy:
      retry: "0"
  - step: publish@release_artifacts
    name: 4aaeabee-4bf3-4a5c-bc82-30f1cf34fd05
    displayName: core amd64 发布
    dependArtifact: zki_core_amd64.tar.gz
    version: "${SEMVER_RELEASE}"
    autoIncrement: false
    strategy:
      retry: "0"
triggers:
  trigger: auto
  push:
    tags:
      prefix: []
      precise: []
      include:
      - "^v(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-(?:alpha|beta|rc)\\.[1-9]\\\
        d*)?$"
notify: []
strategy:
  blocking: true
ref_variable:
- REGISTRY_MIRROR
- APT_MIRROR
- GOPROXY
- TARGET_REGISTRY_MIRROR
