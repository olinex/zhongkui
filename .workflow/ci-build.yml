version: "1.0"
name: 构建、上传、发布
displayName: 构建发布
stages:
- name: 预处理
  displayName: 预处理
  strategy: fast
  trigger: auto
  steps:
  - step: out-param@tools
    name: 39db0d5e-3026-44df-8783-f9d2f3681ab1
    displayName: SemVer Part 参数产出
    params:
      SEMVER_MAJOR: "$(echo ${GITEE_BRANCH} | sed -E 's/^v([0-9]+)\\..*/\\1/')"
      SEMVER_MINOR: "$(echo ${GITEE_BRANCH} | sed -E 's/^v[0-9]+\\.([0-9]+)\\..*/\\\
        1/')"
      SEMVER_PATCH: "$(echo ${GITEE_BRANCH} | sed -E 's/^v[0-9]+\\.[0-9]+\\.([0-9]+).*/\\\
        1/')"
      SEMVER_PRERELEASE: "$(echo ${GITEE_BRANCH} | sed -E 's/^v[0-9]+\\.[0-9]+\\.[0-9]+-(alpha|beta|rc)\\\
        .([1-9][0-9]*)$/\\2/; t; s/.*/0/')"
    strategy:
      retry: "0"
  - step: out-param@tools
    name: d9fc2f24-db48-4c11-8b67-7c3d90c82167
    displayName: SemVer Release 参数产出
    params:
      SEMVER_RELEASE: "${SEMVER_MAJOR}.${SEMVER_MINOR}.${SEMVER_PATCH}.${SEMVER_PRERELEASE}"
    strategy:
      retry: "0"
    dependsOn: 39db0d5e-3026-44df-8783-f9d2f3681ab1
- name: 构建制品
  displayName: 构建制品
  strategy: fast
  trigger: auto
  steps:
  - step: build@golang
    name: e43d16bd-6301-4f97-9882-7e2aeeb8c27a
    displayName: core arm64 amd64 构建
    golangVersion: "1.27"
    commands:
    - "# 1. 安装交叉编译工具链"
    - bash deploys/scripts/core-setup-build-env.sh --host-arch "$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
    - ""
    - "# 2. 下载依赖（首次跑 / go.mod 变更时才真正下载；命中缓存时秒过）"
    - go mod download
    - ""
    - "# 3. 编译 amd64"
    - bash deploys/scripts/core-build-multiarch.sh \
    - '    --skip-apt \'
    - '    --arch amd64 \'
    - '    --out dist/bin/zki-core-linux-amd64 \'
    - "    \"${GITEE_BRANCH}\""
    - ""
    - "# 4. 编译 arm64"
    - bash deploys/scripts/core-build-multiarch.sh \
    - '    --skip-apt \'
    - '    --arch arm64 \'
    - '    --out dist/bin/zki-core-linux-arm64 \'
    - "    \"${GITEE_BRANCH}\""
    - ""
    - '   ls -lh dist/bin/'
    artifacts:
    - name: zki-core-linux-amd64
      path:
      - dist/bin/zki-core-linux-amd64
      type: .tar.gz
    - name: zki-core-linux-arm64
      path:
      - dist/bin/zki-core-linux-arm64
      type: .tar.gz
    caches:
    - /go/pkg/mod
    - /root/.cache/go-build
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
  - step: build@nodejs
    name: a9f154ae-3862-4a1a-bd2d-48dbd8eff4c5
    displayName: web 构建
    nodeVersion: 26.12.1
    commands:
    - corepack enable
    - corepack prepare pnpm@10.34.9 --activate
    - pnpm config set store-dir /pnpm-store
    - "export npm_config_registry=\"${NPM_MIRROR}\""
    - export DOCS_LAST_UPDATED=false
    - export VITE_ZHONGKUI_BASE_URL=/api/v1
    - export VITE_DOCS_URL=/docs/
    - export DOCS_BASE=/docs/
    - export DOCS_CONSOLE_URL=/console
    - bash deploys/scripts/web-build.sh --deps
    - bash deploys/scripts/web-build.sh --build
    - test -f web/dist/index.html
    - test -f docs/.vitepress/dist/index.html
    - mkdir -p dist/html/docs
    - mv web/nginx.conf.template dist/
    - mv -f web/dist dist/html
    - mv -f docs/.vitepress/dist dist/html/docs
    - du -sh dist
    artifacts:
    - name: zki-web-dist
      path:
      - ./dist
      type: .tar.gz
    caches:
    - "~/.npm"
    - /pnpm-store
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: auto
  push:
    tags:
      prefix: []
      precise: []
      include:
      - "^v(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-(?:alpha|beta|rc)\\.[1-9]\\\
        d*)?$"
notify: []
strategy:
  blocking: true
ref_variable:
- REGISTRY_MIRROR
- APT_MIRROR
- GOPROXY
- NPM_MIRROR
