version: "1.0"
name: 构建、上传、发布
displayName: 构建发布
stages:
- name: 构建
  displayName: 构建
  strategy: naturally
  trigger: auto
  steps:
  - step: image-build-plus@buildkitd
    name: da30ea79-8f23-4a8e-a7ea-ed1958400a52
    displayName: 镜像构建
    dockerCerts:
    - uuid: ecd6bdc0-bca1-013f-becb-4e858993359a
    tag: "${GITEE_PIPELINE_BUILD_NUMBER}"
    dockerfile: ./Dockerfile
    context: ""
    # 构建环境无法访问 docker.io，通过构建参数将基础镜像指向加速地址
    # REGISTRY_MIRROR 在 Gitee 流水线「自定义参数/环境变量」中配置（可设为私密），不入库
    args:
      GOLANG_IMAGE: ${REGISTRY_MIRROR}/library/golang:1.27.3-bookworm
      DEBIAN_IMAGE: ${REGISTRY_MIRROR}/library/debian:bookworm-slim
    artifacts: []
    isCache: true
    processorType:
    - amd64
    - arm64
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: auto
  push:
    tags:
      prefix: []
      precise: []
      include:
      - "^v(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-(?:alpha|beta|rc)\\.[1-9]\\\
        d*)?$"
notify: []
strategy:
  blocking: true
