version: "1.0"
name: 构建、上传、发布
displayName: 构建发布
stages:
- name: 预处理
  displayName: 预处理
  strategy: fast
  trigger: auto
  steps:
  - step: out-param@tools
    name: 39db0d5e-3026-44df-8783-f9d2f3681ab1
    displayName: SemVer Part 参数产出
    params:
      SEMVER_MAJOR: "$(echo ${GITEE_BRANCH} | sed -E 's/^v([0-9]+)\\..*/\\1/')"
      SEMVER_MINOR: "$(echo ${GITEE_BRANCH} | sed -E 's/^v[0-9]+\\.([0-9]+)\\..*/\\\
        1/')"
      SEMVER_PATCH: "$(echo ${GITEE_BRANCH} | sed -E 's/^v[0-9]+\\.[0-9]+\\.([0-9]+).*/\\\
        1/')"
      SEMVER_PRERELEASE: "$(echo ${GITEE_BRANCH} | sed -E 's/^v[0-9]+\\.[0-9]+\\.[0-9]+-(alpha|beta|rc)\\\
        .([1-9][0-9]*)$/\\2/; t; s/.*/0/')"
    strategy:
      retry: "0"
  - step: out-param@tools
    name: d9fc2f24-db48-4c11-8b67-7c3d90c82167
    displayName: SemVer Release 参数产出
    params:
      SEMVER_RELEASE: "${SEMVER_MAJOR}.${SEMVER_MINOR}.${SEMVER_PATCH}.${SEMVER_PRERELEASE}"
    strategy:
      retry: "0"
    dependsOn: 39db0d5e-3026-44df-8783-f9d2f3681ab1
- name: 构建镜像
  displayName: 构建镜像
  strategy: naturally
  trigger: auto
  steps:
  - step: image-build-plus@buildkitd
    name: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    displayName: all core 镜像构建
    dockerCerts:
    - uuid: b4d9b4c0-be7a-013f-40b9-362eca6107d0
    tag: "zhongkui-cn-beijing.cr.volces.com/open-source/zhongkui-core-all:${GITEE_BRANCH}"
    dockerfile: ./deploys/build/core.Dockerfile
    context: ""
    isCache: true
    processorType:
    - amd64
    - arm64
    parameter:
      GOLANG_IMAGE: "${REGISTRY_MIRROR}/library/golang:1.27.3-bookworm"
      RUNTIME_IMAGE: "${REGISTRY_MIRROR}/library/debian:bookworm-slim"
      APT_MIRROR: "${APT_MIRROR}"
      GOPROXY: "${GOPROXY}"
      IMAGE_VARIANT: all
      VERSION: "${GITEE_BRANCH}"
      COMMIT: "${GITEE_SHORT_COMMIT}"
      BUILDER: "${GITEE_PIPELINE_TRIGGER_USER}@${GITEE_PIPELINE_NAME}:${GITEE_PIPELINE_BUILD_NUMBER}"
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
  - step: image-copy@skopeo
    name: 8f9c9226-63b9-4378-b392-e113b9d0c47f
    displayName: all core 镜像转推
    dockerCerts:
    - uuid: b4d9b4c0-be7a-013f-40b9-362eca6107d0
    sourceImage: "zhongkui-cn-beijing.cr.volces.com/open-source/zhongkui-core-all:${GITEE_BRANCH}"
    targetImage: zhongkui-cn-beijing.cr.volces.com/open-source/zhongkui-core-all:latest
    arch: all
    strategy:
      retry: "0"
    dependsOn: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  - step: image-build-plus@buildkitd
    name: 44667782-dd61-475d-ad34-23ba3ea3daea
    displayName: normal web 镜像构建
    dockerCerts:
    - uuid: b4d9b4c0-be7a-013f-40b9-362eca6107d0
    tag: "zhongkui-cn-beijing.cr.volces.com/open-source/zhongkui-web:${GITEE_BRANCH}"
    dockerfile: ./deploys/build/web.Dockerfile
    context: ""
    artifacts: []
    isCache: true
    processorType:
    - arm64
    - amd64
    parameter:
      NODE_IMAGE: "${REGISTRY_MIRROR}/library/node:22-bookworm-slim"
      NGINX_IMAGE: "${REGISTRY_MIRROR}/library/nginx:1.27-alpine"
      NPM_REGISTRY: "${NPM_MIRROR}"
      VITE_DOCS_URL: /docs/
      DOCS_BASE: /docs/
      DOCS_CONSOLE_URL: /console
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
  - step: image-copy@skopeo
    name: 7673b09e-4559-47c1-af86-fa042eb328d5
    displayName: normal web 镜像转推
    dockerCerts:
    - uuid: b4d9b4c0-be7a-013f-40b9-362eca6107d0
    sourceImage: "zhongkui-cn-beijing.cr.volces.com/open-source/zhongkui-web:${GITEE_BRANCH}"
    targetImage: zhongkui-cn-beijing.cr.volces.com/open-source/zhongkui-web:latest
    arch: all
    strategy:
      retry: "0"
    dependsOn: 44667782-dd61-475d-ad34-23ba3ea3daea
  - step: image-build-plus@buildkitd
    name: 76fb5131-0471-4244-a872-cec21139136f
    displayName: normal core 镜像构建
    dockerCerts:
    - uuid: b4d9b4c0-be7a-013f-40b9-362eca6107d0
    tag: "zhongkui-cn-beijing.cr.volces.com/open-source/zhongkui-core:${GITEE_BRANCH}"
    dockerfile: ./deploys/build/core.Dockerfile
    context: ""
    isCache: true
    processorType:
    - arm64
    - amd64
    parameter:
      GOLANG_IMAGE: "${REGISTRY_MIRROR}/library/golang:1.27.3-bookworm"
      RUNTIME_IMAGE: "${REGISTRY_MIRROR}/library/debian:bookworm-slim"
      APT_MIRROR: "${APT_MIRROR}"
      GOPROXY: "${GOPROXY}"
      IMAGE_VARIANT: normal
      VERSION: "${GITEE_BRANCH}"
      COMMIT: "${GITEE_SHORT_COMMIT}"
      BUILDER: "${GITEE_PIPELINE_TRIGGER_USER}@${GITEE_PIPELINE_NAME}:${GITEE_PIPELINE_BUILD_NUMBER}"
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
  - step: image-build-plus@buildkitd
    name: da30ea79-8f23-4a8e-a7ea-ed1958400a52
    displayName: slim core 镜像构建
    dockerCerts:
    - uuid: b4d9b4c0-be7a-013f-40b9-362eca6107d0
    tag: "zhongkui-cn-beijing.cr.volces.com/open-source/zhongkui-core-slim:${GITEE_BRANCH}"
    dockerfile: ./deploys/build/core.Dockerfile
    context: ""
    isCache: true
    processorType:
    - arm64
    - amd64
    parameter:
      GOLANG_IMAGE: "${REGISTRY_MIRROR}/library/golang:1.27.3-bookworm"
      RUNTIME_IMAGE: "${REGISTRY_MIRROR}/library/debian:bookworm-slim"
      APT_MIRROR: "${APT_MIRROR}"
      GOPROXY: "${GOPROXY}"
      IMAGE_VARIANT: slim
      VERSION: "${GITEE_BRANCH}"
      COMMIT: "${GITEE_SHORT_COMMIT}"
      BUILDER: "${GITEE_PIPELINE_TRIGGER_USER}@${GITEE_PIPELINE_NAME}:${GITEE_PIPELINE_BUILD_NUMBER}"
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
- name: 制品上传
  displayName: 制品上传
  strategy: naturally
  trigger: auto
  steps:
  - step: execute@docker
    name: a0085b67-f4c2-4c07-994c-6b2d2262c974
    displayName: all core 制品提取
    certificate: b4d9b4c0-be7a-013f-40b9-362eca6107d0
    image: zhongkui-cn-beijing.cr.volces.com/open-source/zhongkui-core-all:latest
    command:
    - "# 移动两份构造制品"
    - ls -lha /out
    - mkdir -p /root/workspace/out
    - cp /out/zki-linux-amd64 /root/workspace/out
    - cp /out/zki-linux-arm64 /root/workspace/out
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - /root/workspace/out/zki-linux-amd64
      - /root/workspace/out/zki-linux-arm64
      type: .tar.gz
    strategy:
      retry: "0"
      resource:
        cpu: "1"
        memory: "2"
  - step: publish@general_artifacts
    name: 6582736f-1a22-476b-8308-490f4711a3b5
    displayName: all core 上传制品
    dependArtifact: BUILD_ARTIFACT
    artifactName: zki_core
    strategy:
      retry: "0"
    dependsOn: a0085b67-f4c2-4c07-994c-6b2d2262c974
  - step: execute@docker
    name: f214080c-f65d-4b23-b66e-9e9e45db976f
    displayName: normal web 制品提取
    certificate: b4d9b4c0-be7a-013f-40b9-362eca6107d0
    image: zhongkui-cn-beijing.cr.volces.com/open-source/zhongkui-web:latest
    command:
    - "# 移动两份构造制品"
    - ls -lha /etc/nginx/templates/default.conf.template
    - ls -lha /usr/share/nginx/
    - mkdir -p /root/workspace/out/html
    - cp /etc/nginx/templates/default.conf.template /root/workspace/out
    - cp -R /usr/share/nginx/html/* /root/workspace/out/html
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - /root/workspace/out/default.conf.template
      - /root/workspace/out/html
      type: .tar.gz
    strategy:
      retry: "0"
      resource:
        cpu: "1"
        memory: "2"
  - step: publish@general_artifacts
    name: 28c869b7-0b84-4b10-98b0-6898afe69cf3
    displayName: normal web 上传制品
    dependArtifact: BUILD_ARTIFACT
    artifactName: zki_web
    strategy:
      retry: "0"
    dependsOn: f214080c-f65d-4b23-b66e-9e9e45db976f
- name: 正式发布
  displayName: 正式发布
  strategy: fast
  trigger: auto
  steps:
  - step: publish@release_artifacts
    name: 58af6da2-74fa-452e-af49-f8eb176f4cbc
    displayName: all core 制品发布
    dependArtifact: zki_core
    version: "${SEMVER_RELEASE}"
    autoIncrement: false
    strategy:
      retry: "0"
  - step: publish@release_artifacts
    name: 5d9939c3-4c80-4b60-9b21-fbbc27e5b0bc
    displayName: normal web 制品发布
    dependArtifact: zki_web
    version: "${SEMVER_RELEASE}"
    autoIncrement: false
    strategy:
      retry: "0"
triggers:
  trigger: auto
  push:
    tags:
      prefix: []
      precise: []
      include:
      - "^v(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-(?:alpha|beta|rc)\\.[1-9]\\\
        d*)?$"
notify: []
strategy:
  blocking: true
ref_variable:
- REGISTRY_MIRROR
- APT_MIRROR
- GOPROXY
- NPM_MIRROR
