version: "1.0"
name: 构建、上传、发布
displayName: 构建发布
stages:
- name: 预处理
  displayName: 预处理
  strategy: fast
  trigger: auto
  steps:
  - step: out-param@tools
    name: 39db0d5e-3026-44df-8783-f9d2f3681ab1
    displayName: SemVer Part 参数产出
    params:
      SEMVER_MAJOR: "$(echo ${GITEE_BRANCH} | sed -E 's/^v([0-9]+)\\..*/\\1/')"
      SEMVER_MINOR: "$(echo ${GITEE_BRANCH} | sed -E 's/^v[0-9]+\\.([0-9]+)\\..*/\\\
        1/')"
      SEMVER_PATCH: "$(echo ${GITEE_BRANCH} | sed -E 's/^v[0-9]+\\.[0-9]+\\.([0-9]+).*/\\\
        1/')"
      SEMVER_PRERELEASE: "$(echo ${GITEE_BRANCH} | sed -E 's/^v[0-9]+\\.[0-9]+\\.[0-9]+-(alpha|beta|rc)\\\
        .([1-9][0-9]*)$/\\2/; t; s/.*/0/')"
    strategy:
      retry: "0"
  - step: out-param@tools
    name: d9fc2f24-db48-4c11-8b67-7c3d90c82167
    displayName: SemVer Release 参数产出
    params:
      SEMVER_RELEASE: "${SEMVER_MAJOR}.${SEMVER_MINOR}.${SEMVER_PATCH}.${SEMVER_PRERELEASE}"
    strategy:
      retry: "0"
    dependsOn: 39db0d5e-3026-44df-8783-f9d2f3681ab1
- name: 构建镜像
  displayName: 构建镜像
  strategy: naturally
  trigger: auto
  steps:
  - step: image-build-plus@buildkitd
    name: da30ea79-8f23-4a8e-a7ea-ed1958400a52
    displayName: normal core 镜像构建
    dockerCerts:
    - uuid: b4d9b4c0-be7a-013f-40b9-362eca6107d0
    tag: "${TARGET_REGISTRY_MIRROR}/open-source/zhongkui-core:${GITEE_BRANCH}"
    dockerfile: ./Dockerfile
    context: ""
    artifacts: []
    isCache: true
    processorType:
    - arm64
    - amd64
    parameter:
      GOLANG_IMAGE: "${REGISTRY_MIRROR}/library/golang:1.27.3-bookworm"
      RUNTIME_IMAGE: "${REGISTRY_MIRROR}/library/debian:bookworm-slim"
      APT_MIRROR: "${APT_MIRROR}"
      GOPROXY: "${GOPROXY}"
      VERSION: "${GITEE_BRANCH}"
      COMMIT: "${GITEE_SHORT_COMMIT}"
      BUILDER: "${GITEE_PIPELINE_TRIGGER_USER}@${GITEE_PIPELINE_NAME}:${GITEE_PIPELINE_BUILD_NUMBER}"
      IMAGE_VARIANT: normal
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
  - step: image-build-plus@buildkitd
    name: 6acefe26-d61b-417b-aef7-09cea931f155
    displayName: slim core 镜像构建
    dockerCerts:
    - uuid: b4d9b4c0-be7a-013f-40b9-362eca6107d0
    tag: "${TARGET_REGISTRY_MIRROR}/open-source/zhongkui-core-slim:${GITEE_BRANCH}"
    dockerfile: ./Dockerfile
    context: ""
    artifacts: []
    isCache: true
    processorType:
    - arm64
    - amd64
    parameter:
      GOLANG_IMAGE: "${REGISTRY_MIRROR}/library/golang:1.27.3-bookworm"
      RUNTIME_IMAGE: "${REGISTRY_MIRROR}/library/debian:bookworm-slim"
      APT_MIRROR: "${APT_MIRROR}"
      GOPROXY: "${GOPROXY}"
      VERSION: "${GITEE_BRANCH}"
      COMMIT: "${GITEE_SHORT_COMMIT}"
      BUILDER: "${GITEE_PIPELINE_TRIGGER_USER}@${GITEE_PIPELINE_NAME}:${GITEE_PIPELINE_BUILD_NUMBER}"
      IMAGE_VARIANT: slim
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
  - step: image-build-plus@buildkitd
    name: 44667782-dd61-475d-ad34-23ba3ea3daea
    displayName: normal web 镜像构建
    dockerCerts:
    - uuid: b4d9b4c0-be7a-013f-40b9-362eca6107d0
    tag: "${TARGET_REGISTRY_MIRROR}/open-source/zhongkui-web:${GITEE_BRANCH}"
    dockerfile: ./web/Dockerfile
    context: ""
    artifacts: []
    isCache: true
    processorType:
    - arm64
    - amd64
    parameter:
      NODE_IMAGE: "${REGISTRY_MIRROR}/library/node:22-bookworm-slim"
      NGINX_IMAGE: "${REGISTRY_MIRROR}/library/nginx:1.27-alpine"
      VITE_DOCS_URL: /docs/
      DOCS_BASE: /docs/
      DOCS_CONSOLE_URL: /console
      NPM_REGISTRY: "${NPM_MIRROR}"
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: auto
  push:
    tags:
      prefix: []
      precise: []
      include:
      - "^v(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-(?:alpha|beta|rc)\\.[1-9]\\\
        d*)?$"
notify: []
strategy:
  blocking: true
ref_variable:
- REGISTRY_MIRROR
- APT_MIRROR
- GOPROXY
- TARGET_REGISTRY_MIRROR
- NPM_MIRROR
